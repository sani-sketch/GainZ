name: GainZ Signal Automation

on:
  workflow_dispatch:

  schedule:
    # 09:40 New York during daylight-saving time
    - cron: "40 13 * * 1-5"

    # 09:40 New York during standard time
    - cron: "40 14 * * 1-5"


permissions:
  contents: read


jobs:

  gainz-signals:

    runs-on: ubuntu-latest

    env:
      TRADING212_API_KEY: ${{ secrets.TRADING212_API_KEY }}
      TRADING212_API_SECRET: ${{ secrets.TRADING212_API_SECRET }}

      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}


    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout GainZ
        uses: actions/checkout@v5


      # =========================================================
      # 2. PYTHON
      # =========================================================

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      # =========================================================
      # 3. DEPENDENCIES
      # =========================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # =========================================================
      # 4. DOWNLOAD FRESH MARKET DATA
      # =========================================================

      - name: Download latest market data
        run: |
          echo "Downloading latest market data from Yahoo Finance..."
          python data/download_prices.py


      # =========================================================
      # 5. VERIFY CRITICAL MARKET DATA
      # =========================================================

      - name: Verify market data
        run: |
          python - <<'PY'
          from pathlib import Path

          data_dir = Path("data")

          required_files = [
              "AAPL_daily.csv",
              "SPY_daily.csv",
          ]

          missing = [
              name
              for name in required_files
              if not (data_dir / name).exists()
          ]

          if missing:
              raise RuntimeError(
                  f"Required market data missing: {missing}"
              )

          csv_files = list(
              data_dir.glob("*_daily.csv")
          )

          print(
              f"Market data ready: "
              f"{len(csv_files)} CSV files"
          )

          print(
              "AAPL and SPY data verified successfully."
          )
          PY


      # =========================================================
      # 6. CHECK NYSE + CORRECT SIGNAL WINDOW
      #
      # Scheduled runs:
      #   Must be an NYSE trading day AND within the
      #   intended 09:35-09:59 New York window.
      #
      # Manual workflow_dispatch runs:
      #   Allowed immediately so the cloud pipeline
      #   can be tested at any time.
      # =========================================================

      - name: Check market and correct time
        id: market_check
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          import pandas_market_calendars as mcal


          now = datetime.now(
              ZoneInfo("America/New_York")
          )

          nyse = mcal.get_calendar("NYSE")

          schedule = nyse.schedule(
              start_date=now.date(),
              end_date=now.date(),
          )

          market_day = not schedule.empty

          correct_time = (
              now.hour == 9
              and 35 <= now.minute <= 59
          )

          manual_run = (
              os.getenv("GITHUB_EVENT_NAME")
              == "workflow_dispatch"
          )

          should_run = (
              manual_run
              or (
                  market_day
                  and correct_time
              )
          )


          print(
              "New York time:",
              now,
          )

          print(
              "NYSE trading day:",
              market_day,
          )

          print(
              "Correct signal window:",
              correct_time,
          )

          print(
              "Manual GitHub run:",
              manual_run,
          )

          print(
              "Should generate GainZ signals:",
              should_run,
          )


          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
          ) as f:

              f.write(
                  "market_day="
                  + (
                      "true"
                      if market_day
                      else "false"
                  )
                  + "\n"
              )

              f.write(
                  "correct_time="
                  + (
                      "true"
                      if correct_time
                      else "false"
                  )
                  + "\n"
              )

              f.write(
                  "manual_run="
                  + (
                      "true"
                      if manual_run
                      else "false"
                  )
                  + "\n"
              )

              f.write(
                  "should_run="
                  + (
                      "true"
                      if should_run
                      else "false"
                  )
                  + "\n"
              )
          PY


      # =========================================================
      # 7. GENERATE GAINZ SIGNALS
      #
      # SIGNAL ONLY.
      #
      # There is deliberately NO --execute-demo flag.
      #
      # run_trading212.py:
      #   - reads the Practice account
      #   - generates target weights
      #   - builds BUY/SELL plan
      #   - sends the plan to Telegram
      #   - dry-runs execution
      #
      # It does NOT submit Trading 212 orders.
      # =========================================================

      - name: Generate GainZ signals
        if: steps.market_check.outputs.should_run == 'true'
        run: |
          python run_trading212.py


      # =========================================================
      # 8. SKIP CLOSED MARKET / WRONG SCHEDULED SLOT
      # =========================================================

      - name: Skip because market is closed or wrong time slot
        if: steps.market_check.outputs.should_run != 'true'
        run: |
          echo "GainZ signal generation skipped because NYSE is closed or this is not the correct scheduled signal window."


      # =========================================================
      # 9. FAILURE NOTIFICATION
      # =========================================================

      - name: Send failure notification
        if: failure()
        run: |
          python - <<'PY'
          from notifications.telegram import send_telegram_message

          send_telegram_message(
              "🚨 GAINZ AUTOMATION FAILED\n\n"
              "GainZ could not generate the signals.\n"
              "Open GitHub Actions to check the logs.\n\n"
              "No live trade was executed."
          )
          PY