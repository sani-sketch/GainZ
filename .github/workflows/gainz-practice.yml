name: GainZ Practice Automation

on:
  workflow_dispatch:

  schedule:
    # 09:40 New York during daylight-saving time
    - cron: "40 13 * * 1-5"

    # 09:40 New York during standard time
    - cron: "40 14 * * 1-5"

permissions:
  contents: read

jobs:
  gainz-practice:
    runs-on: ubuntu-latest

    env:
      TRADING212_API_KEY: ${{ secrets.TRADING212_API_KEY }}
      TRADING212_API_SECRET: ${{ secrets.TRADING212_API_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      # ---------------------------------------------------------
      # 1. CHECKOUT
      # ---------------------------------------------------------

      - name: Checkout GainZ
        uses: actions/checkout@v5

      # ---------------------------------------------------------
      # 2. PYTHON
      # ---------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ---------------------------------------------------------
      # 3. DEPENDENCIES
      # ---------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ---------------------------------------------------------
      # 4. DOWNLOAD FRESH MARKET DATA
      # ---------------------------------------------------------

      - name: Download latest market data
        run: |
          echo "Downloading latest market data from Yahoo Finance..."
          python data/download_prices.py

      # ---------------------------------------------------------
      # 5. VERIFY CRITICAL MARKET DATA
      # ---------------------------------------------------------

      - name: Verify market data
        run: |
          python - <<'PY'
          from pathlib import Path

          data_dir = Path("data")

          required_files = [
              "AAPL_daily.csv",
              "SPY_daily.csv",
          ]

          missing = [
              name
              for name in required_files
              if not (data_dir / name).exists()
          ]

          if missing:
              raise RuntimeError(
                  f"Required market data missing: {missing}"
              )

          csv_files = list(
              data_dir.glob("*_daily.csv")
          )

          print(
              f"Market data ready: "
              f"{len(csv_files)} CSV files"
          )

          print(
              "AAPL and SPY data verified successfully."
          )
          PY

      # ---------------------------------------------------------
      # 6. CHECK NYSE + CORRECT EXECUTION WINDOW
      # ---------------------------------------------------------

      - name: Check market and correct time
        id: market_check
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          import pandas_market_calendars as mcal

          now = datetime.now(
              ZoneInfo("America/New_York")
          )

          nyse = mcal.get_calendar("NYSE")

          schedule = nyse.schedule(
              start_date=now.date(),
              end_date=now.date(),
          )

          market_day = not schedule.empty

          correct_time = (
              now.hour == 9
              and 35 <= now.minute <= 59
          )

          should_run = (
              market_day
              and correct_time
          )

          print(
              "New York time:",
              now,
          )

          print(
              "NYSE trading day:",
              market_day,
          )

          print(
              "Correct execution window:",
              correct_time,
          )

          print(
              "Should execute:",
              should_run,
          )

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
          ) as f:

              f.write(
                  "market_day="
                  + (
                      "true"
                      if market_day
                      else "false"
                  )
                  + "\n"
              )

              f.write(
                  "correct_time="
                  + (
                      "true"
                      if correct_time
                      else "false"
                  )
                  + "\n"
              )

              f.write(
                  "should_run="
                  + (
                      "true"
                      if should_run
                      else "false"
                  )
                  + "\n"
              )
          PY

      # ---------------------------------------------------------
      # 7. CHECK FOR EXISTING PRACTICE ORDERS
      # ---------------------------------------------------------

      - name: Check pending Practice orders
        if: steps.market_check.outputs.should_run == 'true'
        id: pending_check
        run: |
          python - <<'PY'
          import os

          from broker.trading212 import Trading212Broker

          broker = Trading212Broker(
              environment="demo"
          )

          orders = broker.orders()

          pending_count = len(orders)

          print(
              f"Pending orders: {pending_count}"
          )

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
          ) as f:

              f.write(
                  "pending_count="
                  + str(pending_count)
                  + "\n"
              )

              f.write(
                  "can_trade="
                  + (
                      "true"
                      if pending_count == 0
                      else "false"
                  )
                  + "\n"
              )
          PY

      # ---------------------------------------------------------
      # 8. EXECUTE GAINZ PRACTICE REBALANCE
      # ---------------------------------------------------------

      - name: Execute GainZ Practice orders
        if: >
          steps.market_check.outputs.should_run == 'true' &&
          steps.pending_check.outputs.can_trade == 'true'
        id: execute_gainz
        run: |
          python run_trading212.py --execute-demo

      # ---------------------------------------------------------
      # 9. SKIP IF ORDERS ARE ALREADY PENDING
      # ---------------------------------------------------------

      - name: Skip because pending orders exist
        if: >
          steps.market_check.outputs.should_run == 'true' &&
          steps.pending_check.outputs.can_trade != 'true'
        run: |
          echo "GainZ skipped because pending Practice orders already exist."

      # ---------------------------------------------------------
      # 10. SKIP WRONG TIME / CLOSED MARKET
      # ---------------------------------------------------------

      - name: Skip because market is closed or wrong time slot
        if: steps.market_check.outputs.should_run != 'true'
        run: |
          echo "GainZ skipped because NYSE is closed or this is not the correct trading window."

      # ---------------------------------------------------------
      # 11. TELEGRAM - EXECUTED
      # ---------------------------------------------------------

      - name: Send executed notification
        if: >
          success() &&
          steps.market_check.outputs.should_run == 'true' &&
          steps.pending_check.outputs.can_trade == 'true'
        run: |
          python - <<'PY'
          from notifications import notify_success

          notify_success(
              dashboard_url="https://gainz-dashboard.onrender.com/",
              mode="GAINZ",
          )
          PY

      # ---------------------------------------------------------
      # 12. TELEGRAM - PENDING ORDER SKIP
      # ---------------------------------------------------------

      - name: Send pending-orders skipped notification
        if: >
          success() &&
          steps.market_check.outputs.should_run == 'true' &&
          steps.pending_check.outputs.can_trade != 'true'
        run: |
          python - <<'PY'
          from notifications import notify_skipped

          notify_skipped(
              dashboard_url="https://gainz-dashboard.onrender.com/",
              reason=(
                  "Pending Practice orders already exist, "
                  "so GainZ did not submit duplicate orders."
              ),
          )
          PY

      # ---------------------------------------------------------
      # 13. TELEGRAM - MARKET CLOSED / WRONG SLOT
      # ---------------------------------------------------------

      - name: Send market-closed skipped notification
        if: >
          success() &&
          steps.market_check.outputs.should_run != 'true'
        run: |
          python - <<'PY'
          from notifications import notify_skipped

          notify_skipped(
              dashboard_url="https://gainz-dashboard.onrender.com/",
              reason=(
                  "NYSE is closed or this is not the "
                  "scheduled trading window."
              ),
          )
          PY

      # ---------------------------------------------------------
      # 14. TELEGRAM - FAILURE
      # ---------------------------------------------------------

      - name: Send failure notification
        if: failure()
        run: |
          python - <<'PY'
          from notifications import notify_failure

          notify_failure(
              dashboard_url="https://gainz-dashboard.onrender.com/",
              error_message=(
                  "GainZ automation failed. "
                  "Open GitHub Actions for the full logs."
              ),
          )
          PY
